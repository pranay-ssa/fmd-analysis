# depth_plus2_deep: baseline yolo11n-obb backbone + 2 Conv layers at the deepest scale.
# Lead suggestion (2026-09-08): add 2 more convolution layers to the backbone (10 -> 12).
# Insertion point: after the final C3k2 (row 8, 1024 ch), before SPPF (was row 9).
# Effect of +2 rows: SPPF 9 -> 11, C2PSA 10 -> 12, all head row indices shift +2.
# Mandatory head retaps (without them the new convs are dead compute):
#   P5 concat   [-1, 10] -> [-1, 12]   (C2PSA now row 12)
#   head P4 ref [-1, 13] -> [-1, 15]
#   OBB inputs  [16, 19, 22] -> [18, 21, 24]
#   P3/P4 backbone taps (rows 4, 6) unchanged (both sit before the insertion).
# nc is overridden at runtime by dataset.yaml.
nc: 80

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, Conv, [1024, 3, 1]] # 9 NEW: depth +1
  - [-1, 1, Conv, [1024, 3, 1]] # 10 NEW: depth +2
  - [-1, 1, SPPF, [1024, 5]] # 11 (was 9)
  - [-1, 2, C2PSA, [1024]] # 12 (was 10)

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4 (row 6 unchanged)
  - [-1, 2, C3k2, [512, False]] # 15
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3 (row 4 unchanged)
  - [-1, 2, C3k2, [256, False]] # 18 (P3/8-small)
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 15], 1, Concat, [1]] # cat head P4 (was 13)
  - [-1, 2, C3k2, [512, False]] # 21 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P5 (C2PSA now row 12)
  - [-1, 2, C3k2, [1024, True]] # 24 (P5/32-large)
  - [[18, 21, 24], 1, OBB, [nc, 1]] # OBB(P3, P4, P5)
