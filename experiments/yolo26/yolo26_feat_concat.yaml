# yolo26_feat_concat: P3→P4 skip connection for small-defect feature reuse
# Lead idea: concatenate low/mid layer features more aggressively
# Change: add a direct P3→P4 skip path (Conv stride-2 downsample) so the P4
# head stage gets raw backbone P3 features in addition to the standard FPN path.
# This is a minimal first test of the lead's hypothesis.
#
# Diff from baseline (yolo26n):
#   Row 12 (new): Conv [256, 3, 2] — downsample P3 to P4 resolution
#   Row 13 (was 12): Concat [row 11 (P5 upsampled), row 12 (P3 downsampled)]
#   Row 14 (was 13): C3k2 [768, True] — channels increased (512 from concat + 256 from P3)
#   Rows 15-23: shifted by +1, P4→P3 concat ref changed from row 6 to row 12
nc: 80

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 2, C3k2, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]        # 9
  - [-1, 2, C2PSA, [1024]]          # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 - cat P4 backbone (standard FPN)
  - [-1, 2, C3k2, [512, True]]                   # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 - cat P3 backbone (standard FPN)
  - [-1, 2, C3k2, [256, True]]                   # 16 - P3 output (small defects)

  # === NEW: P3→P4 skip path ===
  - [16, 1, Conv, [256, 3, 2]]                   # 17 - downsample P3 to P4 resolution

  - [[-1, 13], 1, Concat, [1]]                   # 18 - cat P4 head + P3 skip
  - [-1, 2, C3k2, [512, True]]                   # 19 - P4 output (medium defects)

  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21 - cat P5 backbone
  - [-1, 1, C3k2, [1024, True, 0.5, True]]       # 22 - P5 output (large defects)

  - [[16, 19, 22], 1, Detect, [nc]]              # 23 - detect from P3, P4, P5
