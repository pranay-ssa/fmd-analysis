# yolo26_feat_concat_v2: standard FPN + P3→P4 skip (additive, not replacement)
# Keeps the P5→P4 connection AND adds P3 downsampled as extra input to P4 head.
nc: 80

scales:
  n: [0.50, 0.25, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]       # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]      # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]]      # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]]      # 5-P4/16
  - [-1, 2, C3k2, [512, True]]      # 6
  - [-1, 1, Conv, [1024, 3, 2]]     # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]     # 8
  - [-1, 1, SPPF, [1024, 5]]        # 9
  - [-1, 2, C2PSA, [1024]]          # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 - P5 up + P4 backbone (standard)
  - [-1, 2, C3k2, [512, True]]                   # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 - P4 up + P3 backbone (standard)
  - [-1, 2, C3k2, [256, True]]                   # 16 - P3 output

  # === NEW: P3→P4 skip (additive) ===
  - [16, 1, Conv, [256, 3, 2]]                   # 17 - downsample P3 to P4 resolution
  - [[-1, 11, 13], 1, Concat, [1]]               # 18 - P3 skip + P5 up + P4 head (3-way)
  - [-1, 2, C3k2, [512, True]]                   # 19 - enriched P4 output

  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21 - P5 backbone
  - [-1, 1, C3k2, [1024, True, 0.5, True]]       # 22 - P5 output

  - [[16, 19, 22], 1, Detect, [nc]]              # 23
