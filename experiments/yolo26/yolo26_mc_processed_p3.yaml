# yolo26_mc_processed_p3.yaml - H2: processed early-layer features into the mid stage.
#
# Multiclass arena (dataset_multiclass, 10 classes). ONE variable against stock yolo26n.
#
# Difference from the raw tap that R1 tested:
#   R1 (raw, tested, cost -0.0560 mAP50 on single-class crops):
#       [4, 1, Conv, [256, 3, 2]]                    -> straight into the P4 concat
#   H2 (this file, processed):
#       [4, 1, Conv, [256, 3, 2]]                    -> downsample the raw backbone P3 to P4 size
#       [18, 1, C3k2, [256, True]]                   -> PROCESS it (a C3k2 block filters the signal)
#       ... then concat the processed tap into the P4 stage
# The standard FPN and PAN path is untouched, so this tests "clean the early features before
# handing them over", which is the half of the lead's idea that R1 left open.
#
# Everything else is copied verbatim from the ultralytics 8.4.142 stock yolo26.yaml:
# nc, end2end: True, reg_max: 1, the full scales block, the SPPF arg form [1024, 5, 3, True],
# and every other row. Do not shorten an arg list or drop a top-level key (ADR-011 / P-9).
#
# Gate before training:
#   python3 preflight_fork.py experiments/yolo26/yolo26_mc_processed_p3.yaml

nc: 80
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins

scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 <- the early-layer tap source (128 effective channels)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9 (arg form is NOT optional)
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)
  - [16, 1, Conv, [256, 3, 2]] # 17 stock row, only its "from" is written out (-1 and 16 are the same row)
  - [4, 1, Conv, [256, 3, 2]] # 18 H2 EDIT (a): downsample the raw backbone P3 to P4 resolution
  - [18, 1, C3k2, [256, True]] # 19 H2 EDIT (b): PROCESS the tap before it is used
  - [[19, 17, 13], 1, Concat, [1]] # 20 H2 EDIT (c): processed tap + P3 head + head P4
  - [-1, 2, C3k2, [512, True]] # 21 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]] # 22
  - [[-1, 10], 1, Concat, [1]] # 23 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 24 (P5/32-large)
  - [[16, 21, 24], 1, Detect, [nc]] # 25 Detect(P3, P4, P5)
