# yolo26_feat_concat_r1.yaml - R1: the attributable feature-concat test.
#
# ONE variable against stock yolo26n: an extra raw backbone-P3 tap (row 4, 128 effective
# channels at n-scale) downsampled to P4 resolution and concatenated into the P4 output
# stage, so the mid stage sees the raw low-layer feature alongside the standard FPN path.
#
# This is the design the 2026-09-10 forks claimed to implement but did not:
#   - V1 (yolo26_feat_concat.yaml) contained no head edit at all (it was the stock head)
#   - V2 (yolo26_feat_concat_v2.yaml) added the raw upsampled P5 tensor, not a P3 tap
#
# Everything else is copied verbatim from the ultralytics 8.4.142 stock yolo26.yaml:
# nc, end2end: True, reg_max: 1, the full scales block, the SPPF arg form [1024, 5, 3, True],
# and every other row. Do not shorten an arg list or drop a top-level key here: parse_model
# fills the gaps with different defaults and the fork silently becomes a different detector
# (see ADR-011 / pitfall P-9 in experiments/README.md).
#
# The only index changes are the ones the insertion forces: stock row 17 keeps its target
# (row 16) written explicitly, and Detect's P4 ref moves 19 -> 20.
#
# Gate before training: python3 vm/ops/preflight_fork.py experiments/yolo26/yolo26_feat_concat_r1.yaml
# It asserts the head is stock (reg_max=1 with the one2one branch), that no stock key was
# dropped, and prints the row-level diff so the single edit is visible.

nc: 80
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins

scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4 <- low-layer P3 tap for R1 (comes after the width factor)
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9 (arg form is NOT optional)
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 11
  - [[-1, 6], 1, Concat, [1]] # 12 cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 13
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 14
  - [[-1, 4], 1, Concat, [1]] # 15 cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 16 (P3/8-small)
  - [16, 1, Conv, [256, 3, 2]] # 17 stock: downsample the P3 head output to P4 resolution
  - [4, 1, Conv, [256, 3, 2]] # 18 R1 EDIT: downsample the raw backbone P3 to P4 resolution
  - [[-1, 17, 13], 1, Concat, [1]] # 19 R1 EDIT: 3-way = [P3 tap, P3 head, head P4]
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium)
  - [-1, 1, Conv, [512, 3, 2]] # 21
  - [[-1, 10], 1, Concat, [1]] # 22 cat head P5
  - [-1, 1, C3k2, [1024, True, 0.5, True]] # 23 (P5/32-large)
  - [[16, 20, 23], 1, Detect, [nc]] # 24 Detect(P3, P4, P5)
